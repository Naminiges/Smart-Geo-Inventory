<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label - {{ detail.serial_number }}</title>
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Toolbar/Action Buttons */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            z-index: 10;
            animation: fadeIn 0.5s ease-out;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.4);
            transition: all 0.2s ease-in-out;
        }

        .btn:hover {
            background-color: #047857;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(5, 150, 105, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #475569;
            box-shadow: 0 4px 6px -1px rgba(71, 85, 105, 0.4);
        }

        .btn-secondary:hover {
            background-color: #334155;
            box-shadow: 0 6px 12px -2px rgba(71, 85, 105, 0.5);
        }

        /* Label Container (Outer card preview in browser) */
        .label-preview-wrapper {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* The Printable Label itself */
        .label-container {
            background-color: var(--card-bg);
            color: var(--text-dark);
            padding: 15px;
            border: 3px solid #000000;
            border-radius: 8px;
            width: 380px; /* Tag/Sticker size */
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
        }

        td {
            border: 2px solid #000000;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        .label-title {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        .serial-number {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .item-name {
            font-size: 14px;
            font-weight: 700;
            height: 48px;
            word-break: break-word;
        }

        .meta-cell {
            font-size: 11px;
            font-weight: 700;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Print Styling */
        @media print {
            body {
                background: none !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                display: block !important;
            }

            .toolbar {
                display: none !important;
            }

            .label-preview-wrapper {
                background: none !important;
                backdrop-filter: none !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                display: block !important;
                margin: 0 !important;
            }

            .label-container {
                border: 3px solid #000000 !important;
                box-shadow: none !important;
                margin: 0 !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Toolbar for browser preview -->
    <div class="toolbar">
        <button onclick="window.print()" class="btn">
            <i class="fas fa-print"></i> Cetak Label / Simpan PDF
        </button>
        <a href="javascript:window.close()" class="btn btn-secondary">
            <i class="fas fa-times"></i> Tutup
        </a>
    </div>

    <!-- Wrapper with design styling for browser preview -->
    <div class="label-preview-wrapper">
        <div class="label-container">
            <table>
                <!-- Baris 1: Serial Number -->
                <tr>
                    <td colspan="3">
                        <span class="label-title">Serial Number</span>
                        <div class="serial-number">{{ detail.serial_number }}</div>
                    </td>
                </tr>
                <!-- Baris 2: Nama Barang -->
                <tr>
                    <td colspan="3">
                        <span class="label-title">Nama Barang</span>
                        <div class="item-name">{{ detail.item.name }}</div>
                    </td>
                </tr>
                <!-- Baris 3: Kode Barang | Tahun diterima | Bulan diterima -->
                <tr>
                    <td class="meta-cell" style="width: 40%;">
                        <span class="label-title">Kode Barang</span>
                        <div>{{ detail.item.item_code }}</div>
                    </td>
                    <td class="meta-cell" style="width: 30%;">
                        <span class="label-title">Tahun</span>
                        <div>{{ year_received }}</div>
                    </td>
                    <td class="meta-cell" style="width: 30%;">
                        <span class="label-title">Bulan</span>
                        <div>{{ month_received }}</div>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // Otomatis memicu print dialog setelah halaman termuat
        window.onload = function() {
            setTimeout(function() {
                window.print();
            }, 600);
        };
    </script>
</body>
</html>
